name: Feature request
description: Suggest an improvement or new capability.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: please skim the open issues and the `v0.1.0` milestone
        to see if this is already tracked.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user-visible problem. Avoid jumping to the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch what the change would look like — UI, data, filter logic, anything relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem and why they're worse.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Tiny (one file, no data change)
        - Small (a new filter axis or a new screen element)
        - Medium (touches the filter module + the UI)
        - Large (rethinks something architectural, e.g. the catalogue pipeline)
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I checked existing issues and the v0.1.0 milestone.
          required: true
        - label: I'm willing to either implement this or help review a PR for it.
          required: false
