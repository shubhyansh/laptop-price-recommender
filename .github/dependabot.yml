version: 2
updates:
  # Python runtime + dev deps.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      python-runtime:
        patterns:
          - "streamlit"
          - "pandas"
          - "requests"
          - "beautifulsoup4"
          - "lxml"
      python-dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "coverage*"

  # GitHub Actions workflow pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
      include: scope
